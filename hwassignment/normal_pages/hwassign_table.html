<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Table</title>
    <style>
      table, td, th{
        /* border: 1px; */
        /* border-collapse: collapse; */
        text-align: center;
        /* border-spacing: 0; */
      }
    </style>
  </head>
  <body>
    <table
      align="center"
      border="1px"
    >
      <caption>
        Stack Overflow
      </caption>

      <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
      </tr>
      <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topic</th>
      </tr>
      <tr>
        <th>Begin</th>
        <th>End</th>
      </tr>
      <tr>
        <td rowspan="2">Monday</td>
        <td rowspan="2">8 : 00 a.m.</td>
        <td rowspan="2">5 : 00 p.m.</td>
        <td>Introduction to XML</td>
      </tr>
      <tr>
        <td>Validity: DTD and Relax NG</td>
      </tr>
      <tr>
        <td rowspan="2">Tuesday</td>
        <td rowspan="2">
          <table width="100%" border="1px">
            <tr>
              <td>8 : 00 a.m.</td>
            </tr>
            <tr>
              <td>11 : 00 a.m.</td>
            </tr>
            <tr>
              <td>2 : 00 p.m.</td>
            </tr>
          </table>
        </td>
        <td rowspan="2">
            <table width="100%" border="1px">
            <tr>
              <td>11 : 00 a.m.</td>
            </tr>
            <tr>
              <td>2 : 00 p.m.</td>
            </tr>
            <tr>
              <td>5 : 00 p.m.</td>
            </tr>
          </table>
        </td>
        <td>XPath</td>
      </tr>
      <tr>
        <td>XSL Transformations</td>
      </tr>
      <tr>
        <td>Wednesday</td>
        <td>8 : 00 a.m.</td>
        <td>5 : 00 p.m.</td>
        <td>XSL Formatting Objects</td>
      </tr>
    </table>
  </body>
</html>
