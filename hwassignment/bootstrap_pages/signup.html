<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Homepage</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container-fluid bg-secondary">
      <!-- navbar - first - homepage -->
      <div class="row">
        <div class="col-md-12 bg-primary text-white text-center">
          <h1>Homepage</h1>
        </div>
      </div>

      <!-- navbar - second - links -->
      <div class="row">
        <div
          class="d-flex p-3 text-white text-center justify-content-start gap-3"
        >
          <a class="btn btn-dark" href="index.html">Home</a>
          <a class="btn btn-dark" href="contact.html">Contact</a>
          <a class="btn btn-dark" href="about.html">About</a>
          <a class="btn btn-dark" href="login.html">Login</a>
          <a class="btn btn-dark" href="signup.html">Signup</a>
        </div>
      </div>

      <!-- navbar - third - Navbar 2 -->
      <div class="row bg-danger text-white text-center h-75">
        <div class="text-white text-center">
          <h2>Navbar 2</h2>
        </div>
      </div>

      <!-- main content -->

      <div class="row" style="height: 700px">
        <!-- first column -->
        <!-- <div class="col-md-3 bg-secondary text-white text-center list-group">
          <div  class="m-3 span-2">
            <a class="btn btn-dark btn-block" href="home.html">Home</a>
          </div>
          <div  class="m-3">
            <a class="btn btn-dark" href="contact.html">Contact</a>
          </div>
          <div  class="m-3">
            <a class="btn btn-dark" href="about.html">About</a>
          </div>
          <div  class="m-3">
            <a class="btn btn-dark" href="login.html">Login</a>
          </div>
          <div  class="m-3">
            <a class="btn btn-dark" href="signup.html">Signup</a>
          </div>
        </div> -->

        <div
          class="col-md-3 bg-secondary text-white text-center list-group p-3"
        >
          <a class="btn btn-dark mb-3" href="index.html">Home</a>

          <a class="btn btn-dark mb-3" href="contact.html">Contact</a>

          <a class="btn btn-dark mb-3" href="about.html">About</a>

          <a class="btn btn-dark mb-3" href="login.html">Login</a>

          <a class="btn btn-dark mb-3" href="signup.html">Signup</a>
        </div>

        <!-- second column -->
        <div class="col-md-6 container text-white text-center bg-secondary">
          <div class="justify-content-center m-3">
            <h3>Signup</h3>
            <form action="" method="post" class="input-group mb-3">
                <table class="table table-secondary bg-secondary">
                <tr>
                  <td>
                    <Label class="form-control" name="firstname"
                      >First Name :</Label
                    >
                  </td>
                  <td>
                    <input class="form-control" type="text" name="firstname" />
                  </td>
                </tr>
                <tr>
                  <td>
                    <Label class="form-control" name="lastname"
                      >Last Name :</Label
                    >
                  </td>
                  <td>
                    <input class="form-control" type="text" name="lastname" />
                  </td>
                </tr>
                <tr>
                  <td>
                    <Label class="form-control" name="email"
                      >Email Address :</Label
                    >
                  </td>
                  <td>
                    <input class="form-control" type="email" name="email" />
                  </td>
                </tr>
                <tr>
                  <td>
                    <Label class="form-control" name="password"
                      >Password :</Label
                    >
                  </td>
                  <td>
                    <input
                      class="form-control"
                      type="password"
                      name="password"
                    />
                  </td>
                </tr>
                <tr>
                  <td>
                    <Label class="form-control" name="confirmpassword"
                      >Confirm Password :</Label
                    >
                  </td>
                  <td>
                    <input
                      class="form-control"
                      type="password"
                      name="confirmpassword"
                    />
                  </td>
                </tr>
                <tr>
                  <!-- <td>
              <Label name="submit">Create Account</Label>
            </td> -->
                  <td colspan="2">
                    <input
                      class="form-control"
                      type="submit"
                      name="submit"
                      value="Create Account"
                      style="width: 100%"
                    />
                  </td>
                </tr>
              </table>
            </form>
          </div>
        </div>

        <!-- third column -->
        <div class="col-md-3 bg-secondary text-white text-center">
          <h2>Sidebar2</h2>
        </div>
      </div>
    </div>

    <!-- footer - fixed bottom -->
    <div class="row fixed-bottom">
      <div class="col-md-6 bg-dark text-white text-center">
        <h2>Footer 1</h2>
      </div>
      <div class="col-md-6 bg-dark text-white text-center">
        <h2>Footer 2</h2>
      </div>
      <div class="col-md-12 bg-info text-white text-center">
        <h2>Footer 3</h2>
      </div>
    </div>

    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
